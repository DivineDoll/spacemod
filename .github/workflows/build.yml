name: Build SpaceMod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar mod
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Guardar archivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: spacemod-build
          path: build/libs/*.jar
